<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impulsionar | Entrar</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/formularios.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script type="module" src="../js/script.js"></script>
</head>
<body>

  <header class="cabecalho">
    <h1>
      <img src="../imagens/logo_projeto_impulsionar.png" alt="Impulsionar">
    </h1>
    <p class="subtitulo">Acesse a sua conta.</p>
  </header>

  <nav class="menu" aria-label="Menu principal">
    <button type="button" class="menu-hamburguer" aria-label="Menu" aria-controls="menu-principal" aria-expanded="false">☰</button>

    <ul class="nav-links" id="menu-principal">
      <li><a href="index.html" data-rota="index.html">Início</a></li>
      <li class="menu-dropdown">
        <a href="projetos.html" data-rota="projetos.html">Projetos</a>
        <ul class="submenu">
          <li><a href="projetos.html#inclusao">Inclusão Digital</a></li>
          <li><a href="projetos.html#empregabilidade">Empregabilidade</a></li>
          <li><a href="projetos.html#oportunidades">Oportunidades</a></li>
        </ul>
      </li>
      <li><a href="capacitacao.html" data-rota="capacitacao.html">Capacitação</a></li>
      <li><a href="cadastro.html" data-rota="cadastro.html">Faça parte</a></li>
      <li id="item-entrar"><a href="login.html" data-rota="login.html">Entrar</a></li>
      <li id="item-sair" hidden><button type="button" id="botao-sair">Sair</button></li>
    </ul>
  </nav>

  <main id="conteudo-principal">

    <section class="introducao">
      <h2>Entrar</h2>
      <p>Acesse a sua conta para usar os recursos do Impulsionar.</p>
    </section>

    <section class="formulario">
      <!-- method="post": se o JavaScript falhar, a senha nunca vai para a barra de endereço -->
      <form id="formularioLogin" method="post" action="#">
        <fieldset>
          <legend>Acesso à conta</legend>

          <label for="login-email">E-mail:</label>
          <input
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            required
          >

          <label for="login-senha">Senha:</label>
          <input
            type="password"
            id="login-senha"
            name="senha"
            autocomplete="current-password"
            required
          >
        </fieldset>

        <button type="submit">Entrar</button>
      </form>
    </section>

    <div id="alertaLogin" class="alerta" role="alert">
      <strong id="mensagemLogin"></strong>
    </div>

  </main>

  <footer>
    <p>Impulsionar © 2026</p>
    <p>
      <i class="fa-solid fa-phone" aria-hidden="true"></i>
      <a href="tel:+5511999999999">(11) 99999-9999</a>
    </p>
    <p>
      <i class="fa-solid fa-envelope" aria-hidden="true"></i>
      <a href="mailto:contato@impulsionar.org">contato@impulsionar.org</a>
    </p>
  </footer>

</body>
</html>
